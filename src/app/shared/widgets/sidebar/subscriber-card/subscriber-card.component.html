@if (profile(); as subscriber) {
  <a class="subscriber-card" type="button" [routerLink]="'/profile/' + subscriber.id">
    <img alt="" class="img-border-radius" [height]="32" [ngSrc]="subscriber.avatarUrl | imgUrl" [width]="32" />
    <strong>{{ subscriber.firstName }} {{ subscriber.lastName }}</strong>
  </a>
}
