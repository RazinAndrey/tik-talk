@if (profile(); as profile) {
  <a class="sidebar-item" [routerLink]="'settings'">
    <img
      [ngSrc]="profile.avatarUrl ? (profile.avatarUrl | imgUrl) : 'assets/images/avatar.png'"
      alt=""
      class="img-border-radius"
      [height]="32"
      [width]="32"
    />

    <span>{{ profile.username }}</span>
    <svg [icon]="'settings'" [directory]="'navbar'" class="settings-icon"></svg>
  </a>
}
