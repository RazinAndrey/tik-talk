@if (profile(); as profile) {
  <a class="sidebar-item">
    @if (profile.avatarUrl) {
      <img [ngSrc]="profile.avatarUrl | imgUrl" alt="" class="img-border-radius" [height]="32" [width]="32" />
    }

    <span>{{ profile.username }}</span>
    <svg [icon]="'settings'" [directory]="'navbar'" class="settings-icon"></svg>
  </a>
}
