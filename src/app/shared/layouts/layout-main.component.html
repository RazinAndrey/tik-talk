<header class="header">
  <button class="burger" type="button" (click)="toggleSidebar()">
    <svg [directory]="'navbar'" [height]="14" [icon]="'burger'" [width]="18"></svg>
  </button>
</header>

@if (sidebarOpen()) {
  <button type="button" class="overlay" aria-label="Закрыть окно" (click)="closeSidebar()"></button>
}

<app-sidebar [class.open]="sidebarOpen()" />

<main class="main-content">
  <router-outlet />
</main>
